<form [class]="{hamburgerOpen: hamburgerOpen}" [formGroup]="searchForm" (submit)="searchForm.valid && search()" novalidate>
  <div class="d-flex search-form-row" [style.--search-chain-accent]="(activeTarget$ | async)?.accentColor || defaultChainAccent" [style.--search-chain-foreground]="searchButtonForeground((activeTarget$ | async)?.accentColor)">
    <div class="search-box-container me-2">
      <div class="search-input-row">
        <div ngbDropdown #chainMenu="ngbDropdown" [autoClose]="false" class="search-chain-selector" placement="bottom-start">
          <button ngbDropdownToggle type="button" class="search-chain-trigger" [attr.aria-label]="menuCopy.choose + ' — ' + menuCopy.selectedAria + ': ' + ((activeTarget$ | async)?.kind === 'router' ? menuCopy.automatic : ((activeTarget$ | async)?.name || sourceChainId))" [attr.title]="(activeTarget$ | async)?.name">
            <ng-container *ngIf="activeTarget$ | async as activeTarget; else defaultChainIcon">
              <img [src]="activeTarget.iconUrl" alt="">
              <span *ngIf="activeTarget.destinationId && !activeTarget.destinationDefault" class="search-chain-target-label">{{ activeTarget.name }}</span>
            </ng-container>
            <ng-template #defaultChainIcon>
              <img [src]="defaultChainIconUrl" alt="">
            </ng-template>
          </button>
          <div ngbDropdownMenu class="search-chain-menu" aria-label="Choose search chain" i18n-aria-label="@@taxi.lightning.search.chooseAria">
            <app-search-results #searchResults class="lightning-search-suggestions" [hidden]="dropdownHidden || !isSourceChainSelected()" [results]="typeAhead$ | async" (selectedResult)="selectedResult($event)"></app-search-results>
            <div class="search-chain-selected-group" role="group" aria-label="Selected explorer" i18n-aria-label="@@taxi.lightning.search.selectedAria">
              <span class="search-chain-group-label"><ng-container i18n="@@taxi.lightning.search.selected">SELECTED</ng-container></span>
              <ng-container *ngIf="selectedExplorer() as explorer; else selectedAutomatic">
                <ng-container *ngTemplateOutlet="explorerRow; context: {$implicit: explorer}"></ng-container>
                <ng-container *ngFor="let destination of childDestinations(explorer); trackBy: trackExplorer">
                  <ng-container *ngTemplateOutlet="explorerRow; context: {$implicit: destination, destination: true}"></ng-container>
                </ng-container>
              </ng-container>
              <ng-template #selectedAutomatic>
                <ng-container *ngIf="selectedExternalCandidate() as candidate; else automaticSelectedRow">
                  <ng-container *ngTemplateOutlet="candidateRow; context: {$implicit: candidate}"></ng-container>
                </ng-container>
                <ng-template #automaticSelectedRow>
                  <ng-container *ngIf="isAutomaticRoutingSelected(); else selectedRegistryState">
                    <ng-container *ngTemplateOutlet="automaticRow"></ng-container>
                  </ng-container>
                  <ng-template #selectedRegistryState>
                    <span class="search-chain-message">{{ explorerRegistryLoaded ? menuCopy.unavailable : menuCopy.loading }}</span>
                  </ng-template>
                </ng-template>
              </ng-template>
            </div>
            <ng-container *ngIf="selectedExplorer() || selectedExternalCandidate()">
              <div class="search-chain-divider" aria-hidden="true"></div>
              <ng-container *ngTemplateOutlet="automaticRow"></ng-container>
            </ng-container>
            <ng-template #automaticRow>
            <div class="search-chain-option search-chain-explorer search-chain-automatic"
              [class.is-current]="isAutomaticRoutingSelected()" style="--chain-option-accent: #ffd21f">
              <button type="button" ngbDropdownItem class="search-chain-select"
                [attr.aria-pressed]="isAutomaticRoutingSelected()" (click)="selectAutomaticRouting()">
                <img src="https://tx.taxi/assets/brand/router-favicon.svg" alt="">
                <span class="search-chain-copy">
                  <span class="search-chain-name"><ng-container i18n="@@taxi.lightning.search.automatic">Automatic Routing</ng-container></span>
                  <span class="search-chain-host">tx.taxi</span>
                </span>
              </button>
              <span class="search-chain-actions">
                <a class="search-chain-new-tab" [href]="hubUrl" (click)="openHub($event)" target="_blank" rel="noopener noreferrer"
                  [attr.aria-label]="menuCopy.openNewTab('tx.taxi')" [attr.title]="menuCopy.openNewTab('tx.taxi')">
                  <fa-icon [icon]="['fas', 'external-link-alt']" aria-hidden="true"></fa-icon>
                </a>
                <a class="search-chain-switch" [href]="hubUrl" (click)="openHub($event)"><ng-container i18n="@@taxi.lightning.search.viewHub">View Hub</ng-container></a>
              </span>
            </div>
            </ng-template>
            <span class="search-chain-group-label"><ng-container i18n="@@taxi.lightning.search.native">NATIVE EXPLORERS</ng-container></span>
            <ng-container *ngIf="searchOptions$ | async as searchOptions">
              <ng-container *ngIf="searchOptions.candidates.length">

                <ng-container *ngFor="let candidate of searchOptions.candidates; trackBy: trackCandidate">
                  <ng-container *ngIf="candidate.firstParty">
                    <ng-container *ngTemplateOutlet="candidateRow; context: {$implicit: candidate}"></ng-container>
                  </ng-container>
                </ng-container>
                <div class="search-chain-divider" aria-hidden="true"></div>
              </ng-container>
            </ng-container>
            <ng-container *ngIf="explorers$ | async as explorers; else explorerRegistryLoading">

              <ng-container *ngFor="let explorer of otherExplorers(explorers); trackBy: trackExplorer">
                <ng-container *ngTemplateOutlet="explorerRow; context: {$implicit: explorer, count: childDestinations(explorer).length}"></ng-container>
                <div *ngIf="childDestinations(explorer).length" class="search-chain-additional-options"
                  [id]="'search-additional-' + explorer.chainId" [hidden]="!additionalExplorersExpanded(explorer)"
                  role="group" [attr.aria-label]="menuCopy.additional(explorer.name)">
                  <ng-container *ngIf="additionalExplorersExpanded(explorer)">
                    <ng-container *ngFor="let destination of childDestinations(explorer); trackBy: trackExplorer">
                      <ng-container *ngTemplateOutlet="explorerRow; context: {$implicit: destination, destination: true}"></ng-container>
                    </ng-container>
                  </ng-container>
                </div>
              </ng-container>
              <span *ngIf="!explorers.length" class="search-chain-message"><ng-container i18n="@@taxi.lightning.search.registryUnavailable">Explorer registry unavailable</ng-container></span>
            </ng-container>
            <span class="search-chain-group-label"><ng-container i18n="@@taxi.lightning.search.external">3RD-PARTY EXPLORERS</ng-container></span>
            <ng-container *ngIf="searchOptions$ | async as searchOptions">
              <ng-container *ngIf="searchOptions.candidates.length">

                <ng-container *ngFor="let candidate of searchOptions.candidates; trackBy: trackCandidate">
                  <ng-container *ngIf="!candidate.firstParty && !isSelectedExternalCandidate(candidate)">
                    <ng-container *ngTemplateOutlet="candidateRow; context: {$implicit: candidate}"></ng-container>
                  </ng-container>
                </ng-container>
                <div class="search-chain-divider" aria-hidden="true"></div>
              </ng-container>
            </ng-container>

            <div *ngFor="let explorer of thirdPartyExplorers$ | async" class="search-chain-option search-chain-explorer" [style.--chain-option-accent]="explorer.accentColor">
              <a class="search-chain-select" [href]="explorer.origin" [attr.aria-label]="menuCopy.openExplorer(explorer.name)">
                <img [src]="explorer.iconUrl" alt="">
                <span class="search-chain-copy"><span class="search-chain-name">{{ explorer.name }}</span><span class="search-chain-host">{{ explorer.host }}</span></span>
              </a>
              <span class="search-chain-actions">
                <a class="search-chain-new-tab" [href]="explorer.origin" target="_blank" rel="noopener noreferrer" [attr.aria-label]="menuCopy.openNewTab(explorer.name)" [attr.title]="menuCopy.openNewTab(explorer.name)"><fa-icon [icon]="['fas', 'external-link-alt']" aria-hidden="true"></fa-icon></a>
                <a class="search-chain-switch" [href]="explorer.origin"><ng-container i18n="@@taxi.lightning.search.open">Open</ng-container></a>
              </span>
            </div>
            <ng-template #candidateRow let-candidate>
                <button
                  type="button"
                  ngbDropdownItem
                  class="search-chain-option search-chain-candidate"
                  [class.is-current]="isSelectedCandidate(candidate)"
                  [attr.aria-pressed]="isSelectedCandidate(candidate)"
                  [style.--chain-option-accent]="candidate.accentColor"
                  (click)="selectCandidate(candidate)"
                >
                  <img [src]="candidate.iconUrl" alt="">
                  <span class="search-chain-copy">
                    <span class="search-chain-name">{{ candidate.name }}<ng-container *ngIf="candidate.destinationName && !candidate.destinationDefault"> · {{ candidate.destinationName }}</ng-container></span>
                    <span class="search-chain-host">{{ candidate.host }}</span>
                  </span>
                  <span class="search-chain-match" [class.is-confirmed]="candidate.confirmed">
                    <ng-container *ngIf="candidate.confirmed; else possibleMatch" i18n="@@taxi.lightning.search.found">Found</ng-container><ng-template #possibleMatch><ng-container i18n="@@taxi.lightning.search.possible">Possible</ng-container></ng-template>
                  </span>
                </button>
            </ng-template>
            <ng-template #explorerRow let-explorer let-destination="destination" let-count="count">
              <div class="search-chain-option search-chain-explorer"
                [class.search-chain-destination]="destination"
                [attr.data-chain-id]="explorer.chainId" [attr.data-destination-id]="explorer.destinationId || null"
                [attr.data-explorer-id]="explorer.id"
                [class.is-current]="isSelectedExplorer(explorer)"
                [style.--chain-option-accent]="explorer.accentColor">
                <button type="button" ngbDropdownItem class="search-chain-select"
                  [attr.aria-pressed]="isSelectedExplorer(explorer)" (click)="selectExplorer(explorer)">
                  <img [src]="explorer.iconUrl" alt="">
                  <span class="search-chain-copy">
                    <span class="search-chain-name">{{ explorer.name }}</span>
                    <span class="search-chain-host" [attr.title]="explorer.host">{{ explorer.host }}</span>
                  </span>
                </button>
                <span *ngIf="count; else rowActions" class="search-chain-row-actions">
                  <button type="button" ngbDropdownItem class="search-chain-count"
                    [attr.aria-expanded]="additionalExplorersExpanded(explorer)"
                    [attr.aria-controls]="'search-additional-' + explorer.chainId"
                    [attr.aria-label]="menuCopy.additionalOptions(explorer.name, count, additionalExplorersExpanded(explorer))"
                    (click)="toggleAdditionalExplorers(explorer)">+{{ count }}</button>
                  <ng-container *ngTemplateOutlet="rowActions"></ng-container>
                </span>
                <ng-template #rowActions>
                <span *ngIf="isOpenedExplorer(explorer); else explorerActions" class="search-chain-opened"><ng-container i18n="@@taxi.lightning.search.opened">Opened</ng-container></span>
                <ng-template #explorerActions>
                  <span class="search-chain-actions">
                    <a class="search-chain-new-tab" [href]="localizedExplorerUrl(explorer.origin)" target="_blank" rel="noopener noreferrer"
                      [attr.aria-label]="menuCopy.openNewTab(explorer.name)" [attr.title]="menuCopy.openNewTab(explorer.name)">
                      <fa-icon [icon]="['fas', 'external-link-alt']" aria-hidden="true"></fa-icon>
                    </a>
                    <a class="search-chain-switch" [href]="localizedExplorerUrl(explorer.origin)"
                      [attr.aria-label]="menuCopy.switchTo(explorer.name)"><ng-container i18n="@@taxi.lightning.search.switch">Switch</ng-container></a>
                  </span>
                </ng-template>
                </ng-template>
              </div>
            </ng-template>
            <ng-template #explorerRegistryLoading>
              <span class="search-chain-message"><ng-container i18n="@@taxi.lightning.search.loadingExplorers">Loading explorers</ng-container></span>
            </ng-template>
          </div>
        </div>
        <input #searchInput dir="auto" (focus)="onSearchInputFocus(); focus$.next($any($event).target.value)" (click)="showSourceSuggestions(); click$.next($any($event).target.value)" (input)="showSourceSuggestions()" formControlName="searchText" type="text" class="form-control" placeholder="Wave a taxi, paste anything here." i18n-placeholder="@@taxi.lightning.search.placeholder" [attr.aria-label]="menuCopy.search + ': ' + (activeTarget$ | async)?.name" [attr.aria-invalid]="searchError ? 'true' : null" [attr.aria-describedby]="searchError ? 'lightning-search-error' : null">
      </div>

      <div *ngIf="searchError" id="lightning-search-error" class="search-error" role="alert">{{ searchError }}</div>
    </div>
    <div>
      <button [disabled]="isSearching" type="submit" class="btn btn-purple search-submit" aria-label="Search" i18n-aria-label="@@taxi.lightning.search.searchAria">
        <fa-icon *ngIf="!(isTypeaheading$ | async) else searchLoading" [icon]="['fas', 'search']" [fixedWidth]="true" title="Search" i18n-title="@@taxi.lightning.search.searchTitle"></fa-icon>
      </button>
    </div>
  </div>
</form>

<ng-template #searchLoading>
  <div class="spinner-border spinner-border-sm" style="color: #fff" role="status" aria-hidden="true" (click)="searchForm.valid && search()"></div>
</ng-template>
