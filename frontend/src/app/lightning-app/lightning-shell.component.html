<header class="sticky-header">
  <nav class="navbar navbar-expand-md navbar-dark">
    <a class="navbar-brand" routerLink="/" (click)="brandClick($event)" [attr.aria-label]="brandLabel" [attr.title]="brandLabel">
      <img src="/resources/branding/lightning-dark-navbar.svg?v=cd42f6e25796" alt="tx.taxi" class="btc-brand-navbar">
    </a>
    <div class="navbar-collapse">
      <ul class="navbar-nav">
        <li *ngFor="let item of nav" class="nav-item" routerLinkActive="active" [routerLinkActiveOptions]="{exact:item.exact}">
          <a class="nav-link" [routerLink]="item.path" [attr.aria-label]="item.label" [attr.title]="item.label"><div class="svg-wrapper"><app-svg-images [name]="item.icon" width="21.59" height="100%"></app-svg-images></div></a>
        </li>
      </ul>
      <a *ngIf="false" class="chain-sponsorship" href="mailto:contact@u.software?subject=tx.taxi%20sponsorship%3A%20Lightning%20%28%2475%2Fweek%29&amp;body=Hi%2C%0A%0AI%20would%20like%20to%20sponsor%20Lightning%20on%20lightning.btc.tx.taxi%20for%20%2475%2Fweek.%0A%0A" aria-label="Sponsor Lightning for $75 per week">{{es ? 'Patrocina esta red por $75/semana' : 'Sponsor this chain for $75/wk'}}</a>
      <div class="search-form-container"><app-search-form></app-search-form></div>
    </div>
  </nav>
</header>
<main class="lightning-content">
  <div *ngIf="health$ | async as health" class="lightning-data-status">
    <span *ngIf="health.state !== 'online'" class="badge bg-warning" role="status"><ng-container *ngIf="health.state === 'connecting'" i18n="@@taxi.lightning.status.connecting">Connecting…</ng-container><ng-container *ngIf="health.state === 'offline'" i18n="@@taxi.lightning.status.reconnecting">Reconnecting…</ng-container><ng-container *ngIf="health.state === 'stale'" i18n="@@taxi.lightning.status.cached">Cached data</ng-container><ng-container *ngIf="health.state === 'stale' && health.sourceUpdatedAt"> · {{health.sourceUpdatedAt | date:'MMM d, y':'UTC'}}</ng-container></span>
  </div>
  <router-outlet></router-outlet>
</main>
<app-global-footer></app-global-footer>
