<div class="code">
  <ul ngbNav #navCodeTemplate="ngbNav" class="nav-tabs code-tab" role="tablist">
    <li ngbNavItem *ngIf="code.codeTemplate.curl && method !== 'websocket'" role="presentation">
      <a ngbNavLink (click)="adjustContainerHeight( $event )" role="tab">cURL</a>
      <ng-template ngbNavContent>
        <div class="subtitle"><ng-container i18n="API Docs code example">Code Example</ng-container> <app-clipboard [text]="wrapCurlTemplate(code)"></app-clipboard></div>
        <pre><code [innerText]="wrapCurlTemplate(code)"></code></pre>
      </ng-template>
    </li>
    <li ngbNavItem *ngIf="code.codeTemplate.python && network !== 'liquid' && network !== 'liquidtestnet'" role="presentation">
      <a ngbNavLink (click)="adjustContainerHeight( $event )" role="tab">Python</a>
      <ng-template ngbNavContent>
        <div class="subtitle"><ng-container i18n="API Docs code example">Code Example</ng-container> <app-clipboard [text]="wrapPythonTemplate(code)"></app-clipboard></div>
        <pre><code [innerText]="wrapPythonTemplate(code)"></code></pre>
      </ng-template>
    </li>
  </ul>
  <div [ngbNavOutlet]="navCodeTemplate"></div>
  <div *ngIf="code.codeTemplate && wrapResponse(code) !== ''" class="response">
    <div class="subtitle"><ng-container i18n="API Docs API response">Response</ng-container> <app-clipboard [text]="wrapResponse(code)"></app-clipboard></div>
    <pre><code [innerText]="wrapResponse(code)"></code></pre>
  </div>
</div>
