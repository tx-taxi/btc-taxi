server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Crawl documents and info pages use the same native app shell and content.
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8081; }
    location = /robots.txt { proxy_pass http://127.0.0.1:8081; }
    location = /index.html { return 308 https://btc.tx.taxi/; }

    # Retired documentation aliases must resolve before the API proxy.
    location = /api/faq { return 308 https://btc.tx.taxi/docs/faq; }
    location = /api/faq/ { return 308 https://btc.tx.taxi/docs/faq; }
    location = /api/api { return 308 https://btc.tx.taxi/docs/api/rest; }
    location = /api/api/rest { return 308 https://btc.tx.taxi/docs/api/rest; }
    location = /api/api/rest/ { return 308 https://btc.tx.taxi/docs/api/rest; }
    location = /api/api/websocket { return 308 https://btc.tx.taxi/docs/api/websocket; }
    location = /api/api/websocket/ { return 308 https://btc.tx.taxi/docs/api/websocket; }

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true,"provider":"mempool.space"}';
    }

    location ^~ /source/ {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    location ~ ^/(?:tx|block|address)/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location ~ ^/og/(?:tx|block|address)/[^/]+\.png$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location /api/ {
        add_header X-Robots-Tag "noindex, follow" always;
        proxy_pass https://mempool.space;
        proxy_set_header Host mempool.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
    }

    location /resources/mining-pools/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # The root uses crawlable content in the localized native Angular shell.
    location = / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    # English is served at the domain root, but Angular's localized build keeps
    # its hashed bundles beneath /en-US. Resolve a root asset to that directory
    # after checking shared root assets such as /resources first.
    location ~* \.(?:js|css|json|webmanifest|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        try_files $uri /en-US$uri =404;
    }

    location / {
        try_files $uri @btc_crawl;
    }

    location @btc_crawl {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
