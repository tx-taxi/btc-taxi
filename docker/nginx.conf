server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true,"provider":"mempool.space"}';
    }

    location ^~ /source/ {
        return 404;
    }

    location ~* \.map$ {
        return 404;
    }

    location ~ ^/(?:tx|block|address)/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location ~ ^/og/(?:tx|block|address)/[^/]+\.png$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass https://mempool.space;
        proxy_set_header Host mempool.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
    }

    location /resources/mining-pools/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # The nginx base image ships its own /usr/share/nginx/html/index.html.
    # Send the domain root straight to the localized Angular entrypoint rather
    # than allowing that inherited file to win the directory lookup.
    location = / {
        try_files /en-US/index.html =404;
    }

    # English is served at the domain root, but Angular's localized build keeps
    # its hashed bundles beneath /en-US. Resolve a root asset to that directory
    # after checking shared root assets such as /resources first.
    location ~* \.(?:js|css|json|webmanifest|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        try_files $uri /en-US$uri =404;
    }

    location / {
        try_files $uri $uri/ /en-US/index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
